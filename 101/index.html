<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Episode 101 — Script</title>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #0b0b0b;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      display: block;
      background: #0b0b0b;
    }

    /*
      The wrapper remains in the upper-right corner after the button fades,
      creating a small activation area that can reveal the button again.
    */
    .dl-wrap {
      position: fixed;
      top: 14px;
      right: 14px;
      width: 42px;
      height: 42px;
      z-index: 10;
    }

    .dl {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;

      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;

      transition:
        opacity 220ms ease,
        background 120ms ease,
        border-color 120ms ease,
        transform 220ms ease;
    }

    .dl:hover {
      background: rgba(0, 0, 0, 0.35);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .dl:active {
      transform: translateY(1px);
    }

    .dl:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.8);
      outline-offset: 3px;
    }

    .dl svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .tip {
      position: absolute;
      right: 0;
      top: calc(100% + 10px);
      white-space: nowrap;
      font: 12px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      letter-spacing: 0.01em;
      color: rgba(255, 255, 255, 0.9);
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 8px 10px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;

      transition:
        opacity 140ms ease 220ms,
        transform 140ms ease 220ms;
    }

    .dl-wrap:hover .tip,
    .dl-wrap:focus-within .tip {
      opacity: 1;
      transform: translateY(0);
    }

    /*
      Timed hidden state.

      The link itself cannot be clicked while invisible. The surrounding
      42px wrapper remains available so hovering or tapping the corner can
      reveal the button again.
    */
    .dl-wrap.is-hidden .dl {
      opacity: 0;
      transform: translateY(-5px);
      pointer-events: none;
    }

    .dl-wrap.is-hidden .tip {
      opacity: 0;
      transform: translateY(-4px);
    }

    /*
      On devices with a mouse or trackpad, entering the upper-right
      activation area reveals the button.
    */
    @media (hover: hover) and (pointer: fine) {
      .dl-wrap.is-hidden:hover .dl,
      .dl-wrap.is-hidden:focus-within .dl {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      .dl-wrap.is-hidden:hover .tip,
      .dl-wrap.is-hidden:focus-within .tip {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Fallback message, which automatically hides after the viewer loads. */
    .fallback {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 10;

      font: 13px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: rgba(255, 255, 255, 0.72);
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 12px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      opacity: 1;
      transform: translateY(0);

      transition:
        opacity 220ms ease,
        transform 220ms ease;
    }

    .fallback a {
      color: rgba(255, 255, 255, 0.9);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .fallback.is-hidden {
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
    }

    /*
      Respect a reader's operating-system preference to reduce animation.
    */
    @media (prefers-reduced-motion: reduce) {
      .dl,
      .tip,
      .fallback {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <iframe
    id="viewer"
    src="https://drive.google.com/file/d/1hcqX2bd-8A5ljpYoEaoJ-6db4F4Z1HZZ/preview"
    allow="fullscreen"
    title="Episode 101 script">
  </iframe>

  <div id="downloadControl" class="dl-wrap">
    <a
      class="dl"
      href="https://drive.google.com/uc?export=download&id=1hcqX2bd-8A5ljpYoEaoJ-6db4F4Z1HZZ"
      aria-label="Download Episode 101 PDF">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M12 3v10"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round" />
        <path
          d="M8 11l4 4 4-4"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round" />
        <path
          d="M5 20h14"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round" />
      </svg>
    </a>

    <div class="tip">Download PDF</div>
  </div>

  <div id="fallback" class="fallback">
    If the script doesn’t load,
    <a
      href="https://drive.google.com/file/d/1hcqX2bd-8A5ljpYoEaoJ-6db4F4Z1HZZ/preview"
      target="_blank"
      rel="noopener">
      open it here
    </a>.
  </div>

  <script>
    (function () {
      const viewer = document.getElementById("viewer");
      const fallback = document.getElementById("fallback");
      const downloadControl = document.getElementById("downloadControl");
      const downloadLink = downloadControl.querySelector(".dl");

      const DOWNLOAD_VISIBLE_TIME = 7000;

      /*
        Hide the fallback once the Google Drive viewer finishes loading.
        If the viewer never loads, the fallback remains visible.
      */
      viewer.addEventListener("load", function () {
        window.setTimeout(function () {
          fallback.classList.add("is-hidden");
        }, 600);
      });

      /*
        Fade the custom download control after seven seconds.
      */
      window.setTimeout(function () {
        downloadControl.classList.add("is-hidden");
      }, DOWNLOAD_VISIBLE_TIME);

      /*
        Touchscreen behavior:

        When the button is hidden, the first tap in its upper-right activation
        area reveals it without downloading. A subsequent tap on the visible
        button follows the download link normally.
      */
      downloadControl.addEventListener("click", function (event) {
        if (
          downloadControl.classList.contains("is-hidden") &&
          event.target !== downloadLink &&
          !downloadLink.contains(event.target)
        ) {
          event.preventDefault();
          downloadControl.classList.remove("is-hidden");
        }
      });

      /*
        Because pointer events are disabled on the invisible link, a tap on
        the hidden activation area normally targets the wrapper itself.
      */
      downloadControl.addEventListener("pointerup", function (event) {
        if (
          event.pointerType === "touch" &&
          downloadControl.classList.contains("is-hidden")
        ) {
          event.preventDefault();
          downloadControl.classList.remove("is-hidden");
        }
      });
    })();
  </script>

</body>
</html>
